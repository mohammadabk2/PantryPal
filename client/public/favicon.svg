  <rect x="11" y="20" width="42" height="40" rx="12" fill="none" stroke="#2F6B3F" stroke-width="3"/>
  <!-- friendly "pal" face -->
  <circle cx="25" cy="31" r="2.3" fill="#2F6B3F"/>
  <circle cx="39" cy="31" r="2.3" fill="#2F6B3F"/>
  <path d="M27 36 Q32 40.5 37 36" fill="none" stroke="#2F6B3F" stroke-width="2.5" stroke-linecap="round"/>
  <!-- glass highlight -->
