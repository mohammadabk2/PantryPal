<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PantryPal logo">
  <defs>
    <clipPath id="pp-jar"><rect x="12.5" y="21.5" width="39" height="37" rx="10.5"/></clipPath>
  </defs>
  <!-- sprout: fresh food -->
  <path d="M32 12 C32 7 30 4 26 3" fill="none" stroke="#2F6B3F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32.5 11 C32 5 37 1 45 1.5 C45.5 8 40 12 32.5 11 Z" fill="#6BBF59"/>
