  <!-- jar -->
  <rect x="11" y="20" width="42" height="40" rx="12" fill="#FFF8EC"/>
  <g clip-path="url(#pp-jar)">
    <path d="M8 46 Q16 41 24 46 T40 46 T56 46 V64 H8 Z" fill="#F4A23C"/>
    <path d="M8 51 Q16 47 24 51 T40 51 T56 51 V64 H8 Z" fill="#6BBF59"/>
